<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ALPAR AI Reporter</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 320px; margin: 0; padding: 16px; background: #09090b; color: #fafafa; }
    h2 { font-size: 16px; margin-top: 0; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.4; }
    .btn { display: block; width: 100%; padding: 10px; background: #fafafa; color: #09090b; text-align: center; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 14px; margin-top: 16px; cursor: pointer; border: none; }
    .btn:hover { background: #e4e4e7; }
  </style>
</head>
<body>
  <h2>Capture AI Failure</h2>
  <p>Did the AI hallucinate or provide a biased response? Click below to capture the current chat and report it to ALPAR AI.</p>
  <button id="captureBtn" class="btn">Capture & Report</button>
  <script src="popup.js"></script>
</body>
</html>

name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment even if CI hasn't run"
        required: false
        default: "false"

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    with:
      force: ${{ github.event.inputs.force == 'true' }}

  deploy:
    name: Trigger Vercel Deployment
    needs: [ci-gate]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          echo "Triggering Vercel deploy hook for alparai.com..."
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Deploy hook called successfully"
          else
            echo "::error::VERCEL_DEPLOY_HOOK secret not configured. Please add it in GitHub Settings > Secrets > Actions."
            exit 1
          fi

      - name: Wait for Vercel build
        run: |
          echo "Waiting 30s for Vercel to start deployment..."
          sleep 30
          echo "Check Vercel dashboard for live status."

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          title: "Production Deployment"
          url: "${{ github.event.head_commit.url }}"
          state: ${{ job.status }}
          description: "Deployed commit: ${{ github.event.head_commit.message }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true

name: Master Plan Consistency Check

on:
  push:
    branches: ["master"]
    paths:
      - "docs/MASTER_PLAN.md"
  pull_request:
    paths:
      - "docs/MASTER_PLAN.md"
  workflow_dispatch:

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Consistency Check
        run: node scripts/check-masterplan-consistency.mjs

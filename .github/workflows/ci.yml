name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      force:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: i18n Key Check
        if: ${{ !inputs.force }}
        run: pnpm i18n:check

      - name: Typecheck
        if: ${{ !inputs.force }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !inputs.force }}
        run: pnpm lint

      - name: Run Vitest tests
        if: ${{ !inputs.force }}
        run: pnpm test

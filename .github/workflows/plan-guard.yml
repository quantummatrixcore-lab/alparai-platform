name: Plan Guard

on:
  push:
    branches: [master]

jobs:
  plan-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Architect marker on plan-document changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          violations=0
          for c in $(git rev-list "$RANGE"); do
            files=$(git show --name-only --format="" "$c")
            guarded=$(echo "$files" | grep -E '^(docs/MASTER_PLAN\.md|\.husky/|\.github/workflows/plan-guard\.yml|[^/]+\.md)$' | grep -vE '^(README|CLAUDE|AGENTS)\.md$' || true)
            if [ -n "$guarded" ]; then
              msg=$(git log -1 --format=%B "$c")
              if ! echo "$msg" | grep -q '\[architect\]'; then
                echo "::error::Commit $c modifies Architect-only paths without the [architect] marker (MASTER_PLAN Rule #14):"
                echo "$guarded" | sed 's/^/  - /'
                violations=1
              fi
            fi
          done
          exit $violations

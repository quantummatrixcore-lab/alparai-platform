name: Plan Branch Sync

on:
  push:
    branches:
      - claude/strategy-brief-review-i93xcv

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/strategy-brief-review-i93xcv

      - name: Inspect diff against master
        id: meta
        shell: bash
        run: |
          set +e
          git fetch origin master --quiet

          CHANGED=$(git diff --name-only origin/master...HEAD)
          echo "Changed files: $CHANGED"

          NON_GOV=$(printf '%s\n' "$CHANGED" | grep -v -E '^(docs/MASTER_PLAN\.md|CLAUDE\.md|AGENTS\.md)$' | grep -v '^$')
          if [ -z "$NON_GOV" ]; then
            echo "gov_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "gov_only=false" >> "$GITHUB_OUTPUT"
          fi

          MSG=$(git log -1 --format=%B HEAD)
          AUTHOR=$(git log -1 --format=%ae HEAD)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          MARKER=$(printf '%s' "$MSG" | grep -cF '[architect]')
          if [ "$MARKER" -gt 0 ]; then
            echo "has_marker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_marker=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Result: author=$AUTHOR"
          exit 0

      # master requires PRs + 7 status checks (repo ruleset) — the default
      # GITHUB_TOKEN cannot bypass that (only admin-bypass identities can
      # push directly), so this opens/updates a PR and requests auto-merge
      # instead of pushing straight to master.
      - name: Open or update PR into master (governance-only, architect-marked, allowlisted author)
        if: steps.meta.outputs.gov_only == 'true' && steps.meta.outputs.has_marker == 'true' && steps.meta.outputs.author == 'noreply@anthropic.com'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          EXISTING=$(gh pr list --base master --head claude/strategy-brief-review-i93xcv --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create --base master --head claude/strategy-brief-review-i93xcv \
              --title "Plan branch sync: governance updates" \
              --body "Automated PR from plan-branch-sync.yml. Governance-only diff (docs/MASTER_PLAN.md / CLAUDE.md / AGENTS.md), [architect]-marked, author on allowlist."
            EXISTING=$(gh pr list --base master --head claude/strategy-brief-review-i93xcv --state open --json number --jq '.[0].number')
          fi
          echo "PR number: $EXISTING"
          gh pr merge "$EXISTING" --auto --squash

      - name: Skip notice
        if: steps.meta.outputs.gov_only != 'true' || steps.meta.outputs.has_marker != 'true' || steps.meta.outputs.author != 'noreply@anthropic.com'
        shell: bash
        run: |
          echo "::warning::Skipping PR/auto-merge — either non-governance files changed, missing [architect] marker, or author not on allowlist. Manual review required."

name: Plan Branch Sync

on:
  push:
    branches:
      - claude/strategy-brief-review-i93xcv

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/strategy-brief-review-i93xcv

      - name: Inspect diff against master
        id: meta
        run: |
          git fetch origin master --quiet
          CHANGED=$(git diff --name-only origin/master...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          GOV_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/MASTER_PLAN.md|CLAUDE.md|AGENTS.md) ;;
              *) GOV_ONLY=false ;;
            esac
          done <<< "$CHANGED"
          echo "gov_only=$GOV_ONLY" >> "$GITHUB_OUTPUT"
          MSG=$(git log -1 --format=%B HEAD)
          AUTHOR=$(git log -1 --format=%ae HEAD)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          if echo "$MSG" | grep -q '\[architect\]'; then
            echo "has_marker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_marker=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge into master (governance-only, architect-marked, allowlisted author)
        if: steps.meta.outputs.gov_only == 'true' && steps.meta.outputs.has_marker == 'true' && steps.meta.outputs.author == 'noreply@anthropic.com'
        run: |
          git config user.name "plan-branch-sync[bot]"
          git config user.email "noreply@anthropic.com"
          git checkout master
          git merge --ff-only claude/strategy-brief-review-i93xcv
          git push origin master

      - name: Skip notice
        if: steps.meta.outputs.gov_only != 'true' || steps.meta.outputs.has_marker != 'true' || steps.meta.outputs.author != 'noreply@anthropic.com'
        run: |
          echo "::warning::Skipping auto-merge to master — either non-governance files changed, missing [architect] marker, or author not on allowlist. Manual review required (git merge claude/strategy-brief-review-i93xcv)."

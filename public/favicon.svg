<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <!-- Left Shield neon border gradient (Fuchsia -> Purple) -->
    <linearGradient id="logo-left-grad" x1="50" y1="20" x2="26" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Right Tech circuits gradient (Cyan -> Teal/Blue) -->
    <linearGradient id="logo-right-grad" x1="50" y1="30" x2="85" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Shield glassmorphism body fill gradient -->
    <linearGradient id="logo-shield-fill-grad" x1="50" y1="20" x2="26" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0.55" />
    </linearGradient>
    
    <!-- Center divider/sword column gradient -->
    <linearGradient id="logo-center-grad" x1="50" y1="20" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Premium neon glow effect -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Shield Half (Accountability & Truth) -->
  <path
    d="M 50,18 C 30,19.5 17,22 15,24 V 48 C 15,68 30,78 50,84 Z"
    fill="url(#logo-shield-fill-grad)"
    stroke="url(#logo-left-grad)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Scales of Justice inside Left Shield -->
  <path
    d="M 50,32 H 32"
    stroke="url(#logo-left-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.9"
  />
  <path
    d="M 32,32 L 23,52 L 41,52 Z"
    stroke="url(#logo-left-grad)"
    stroke-width="1.8"
    stroke-linejoin="round"
    fill="url(#logo-left-grad)"
    fill-opacity="0.06"
  />
  <path
    d="M 20,52 H 44"
    stroke="url(#logo-left-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M 22,52 C 22,60 42,60 42,52 Z"
    fill="url(#logo-left-grad)"
    fill-opacity="0.8"
  />

  <!-- Right Circuits (AI & Innovation) -->
  <!-- Top Circuit Trace -->
  <path
    d="M 50,28 H 68 L 74,22 H 82"
    stroke="url(#logo-right-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logo-glow)"
  />
  <circle
    cx="85"
    cy="22"
    r="3.5"
    fill="#ffffff"
    stroke="#22d3ee"
    stroke-width="1.8"
    filter="url(#logo-glow)"
  />

  <!-- Middle Circuit Trace -->
  <path
    d="M 50,48 H 82"
    stroke="url(#logo-right-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logo-glow)"
  />
  <circle
    cx="85"
    cy="48"
    r="3.5"
    fill="#ffffff"
    stroke="#22d3ee"
    stroke-width="1.8"
    filter="url(#logo-glow)"
  />

  <!-- Bottom Circuit Trace -->
  <path
    d="M 50,68 H 68 L 74,74 H 82"
    stroke="url(#logo-right-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logo-glow)"
  />
  <circle
    cx="85"
    cy="74"
    r="3.5"
    fill="#ffffff"
    stroke="#22d3ee"
    stroke-width="1.8"
    filter="url(#logo-glow)"
  />

  <!-- Center Sword / Divider Column (Strength & Balance) -->
  <path
    d="M 50,18 V 84"
    stroke="url(#logo-center-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 42,78 H 58"
    stroke="url(#logo-center-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>

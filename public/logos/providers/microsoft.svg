<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60" role="img" aria-label="Microsoft">
  <title>Microsoft</title>
  <style>
    .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
      font-size: 24px;
      dominant-baseline: central;
    }
  </style>
  <g transform="translate(12, 15)">
    <!-- Microsoft 4 square logo -->
    <rect x="0" y="0" width="13" height="13" fill="#F25022"/>
    <rect x="15" y="0" width="13" height="13" fill="#7FBA00"/>
    <rect x="0" y="15" width="13" height="13" fill="#00A4EF"/>
    <rect x="15" y="15" width="13" height="13" fill="#FFB900"/>
  </g>
  <text x="52" y="30" class="wordmark">Microsoft</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="ALPAR AI">
  <title>ALPAR AI</title>
  <defs>
    <!-- Left Shield neon border gradient (Fuchsia -> Purple) -->
    <linearGradient id="logo-left-grad" x1="50" y1="20" x2="26" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Right Tech circuits gradient (Cyan -> Teal/Blue) -->
    <linearGradient id="logo-right-grad" x1="50" y1="30" x2="85" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Shield glassmorphism body fill gradient -->
    <linearGradient id="logo-shield-fill-grad" x1="50" y1="20" x2="26" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0.55" />
    </linearGradient>
    
    <!-- Center divider/sword column gradient -->
    <linearGradient id="logo-center-grad" x1="50" y1="20" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wordmark text gradient (White -> Light Purple) -->
    <linearGradient id="alpar-text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Premium neon glow effect -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: New Shield & Tech motif scaled to 56px inside 64px box -->
  <g transform="translate(4, 4) scale(0.56)">
    <!-- Left Shield Half -->
    <path
      d="M 50,18 C 30,19.5 17,22 15,24 V 48 C 15,68 30,78 50,84 Z"
      fill="url(#logo-shield-fill-grad)"
      stroke="url(#logo-left-grad)"
      stroke-width="3.2"
      stroke-linejoin="round"
    />

    <!-- Scales of Justice inside Left Shield -->
    <path
      d="M 50,32 H 32"
      stroke="url(#logo-left-grad)"
      stroke-width="2.2"
      stroke-linecap="round"
      opacity="0.9"
    />
    <path
      d="M 32,32 L 23,52 L 41,52 Z"
      stroke="url(#logo-left-grad)"
      stroke-width="1.8"
      stroke-linejoin="round"
      fill="url(#logo-left-grad)"
      fill-opacity="0.06"
    />
    <path
      d="M 20,52 H 44"
      stroke="url(#logo-left-grad)"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <path
      d="M 22,52 C 22,60 42,60 42,52 Z"
      fill="url(#logo-left-grad)"
      fill-opacity="0.8"
    />

    <!-- Right Circuits -->
    <path
      d="M 50,28 H 68 L 74,22 H 82"
      stroke="url(#logo-right-grad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#logo-glow)"
    />
    <circle
      cx="85"
      cy="22"
      r="3.5"
      fill="#ffffff"
      stroke="#22d3ee"
      stroke-width="1.8"
      filter="url(#logo-glow)"
    />

    <path
      d="M 50,48 H 82"
      stroke="url(#logo-right-grad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#logo-glow)"
    />
    <circle
      cx="85"
      cy="48"
      r="3.5"
      fill="#ffffff"
      stroke="#22d3ee"
      stroke-width="1.8"
      filter="url(#logo-glow)"
    />

    <path
      d="M 50,68 H 68 L 74,74 H 82"
      stroke="url(#logo-right-grad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#logo-glow)"
    />
    <circle
      cx="85"
      cy="74"
      r="3.5"
      fill="#ffffff"
      stroke="#22d3ee"
      stroke-width="1.8"
      filter="url(#logo-glow)"
    />

    <!-- Center Column -->
    <path
      d="M 50,18 V 84"
      stroke="url(#logo-center-grad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <path
      d="M 42,78 H 58"
      stroke="url(#logo-center-grad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Wordmark -->
  <g transform="translate(72, 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="900" letter-spacing="-0.5">
    <text x="0" y="38" font-size="28" fill="url(#alpar-text-grad)">ALPAR</text>
    <text x="86" y="38" font-size="28" font-weight="500" fill="#22d3ee" letter-spacing="0.5">AI</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="ALPAR AI">
  <title>ALPAR AI</title>
  <defs>
    <linearGradient id="alpar-shield" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="alpar-accent" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="alpar-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Icon: shield with AI circuit motif -->
  <g transform="translate(0,0)">
    <!-- Shield silhouette: 56x56, centered in 0..64 box -->
    <path
      d="M32 4 L58 14 V32 C58 46 47 56 32 60 C17 56 6 46 6 32 V14 Z"
      fill="url(#alpar-shield)"
      stroke="#a78bfa"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Inner panel border -->
    <path
      d="M32 9 L53 17 V32 C53 43 44 52 32 55 C20 52 11 43 11 32 V17 Z"
      fill="none"
      stroke="#a78bfa"
      stroke-opacity="0.35"
      stroke-width="1"
      stroke-linejoin="round"
    />

    <!-- AI circuit motif inside shield -->
    <!-- Central node (CPU/brain) -->
    <rect x="28" y="28" width="8" height="8" rx="1.2" fill="#0e0e1a" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="32" cy="32" r="1.2" fill="#a78bfa"/>

    <!-- Horizontal circuit lines (left and right) -->
    <path d="M14 32 H25" stroke="url(#alpar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M14 26 H22" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
    <path d="M14 38 H22" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>

    <path d="M39 32 H50" stroke="url(#alpar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M42 26 H50" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
    <path d="M42 38 H50" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>

    <!-- Circuit node dots (left side) -->
    <circle cx="14" cy="26" r="1.4" fill="#a78bfa"/>
    <circle cx="14" cy="32" r="1.6" fill="#e9d5ff"/>
    <circle cx="14" cy="38" r="1.4" fill="#a78bfa"/>

    <!-- Circuit node dots (right side) -->
    <circle cx="50" cy="26" r="1.4" fill="#a78bfa"/>
    <circle cx="50" cy="32" r="1.6" fill="#e9d5ff"/>
    <circle cx="50" cy="38" r="1.4" fill="#a78bfa"/>

    <!-- Vertical connector (top) -->
    <path d="M32 14 V25" stroke="url(#alpar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="32" cy="14" r="1.6" fill="#e9d5ff"/>

    <!-- Vertical connector (bottom) -->
    <path d="M32 39 V48" stroke="url(#alpar-accent)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="32" cy="48" r="1.6" fill="#e9d5ff"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(72, 0)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="900" letter-spacing="-0.5">
    <text x="0" y="38" font-size="28" fill="url(#alpar-text)">ALPAR</text>
    <text x="86" y="38" font-size="28" font-weight="500" fill="#a78bfa" letter-spacing="0.5">AI</text>
  </g>
</svg>
